name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: coverage run -m pytest -v
      - run: coverage report

  package:
    # Build the sdist and wheel, check the metadata, and make sure the wheel
    # works when installed on its own (no source tree on the path).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/toolproof --version
          /tmp/wheel-env/bin/python -c "import toolproof; print(toolproof.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[docs]"
      - run: mkdocs build --strict

  example:
    # Run toolproof against the example server, the same way a user would in CI.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: toolproof run examples/toolproof.yaml --junit report.xml --json report.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: toolproof-report
          path: |
            report.xml
            report.json

  action:
    # Test the GitHub Action in this repo, installing toolproof from this checkout.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Passing run
        id: good
        uses: ./
        with:
          package: .
          working-directory: examples
          config: toolproof.yaml
          report-name: action-report-${{ matrix.os }}
      - name: Failing run (expected)
        id: bad
        continue-on-error: true
        uses: ./
        with:
          package: .
          command: fuzz
          working-directory: examples
          config: buggy.yaml
          args: --seed 1 --max-time 20
          upload-report: "false"
      - name: Check outputs
        shell: bash
        run: |
          test "${{ steps.good.outputs.passed }}" = "true"
          test "${{ steps.bad.outputs.passed }}" = "false"
          test -f "${{ steps.good.outputs.report-dir }}/report.html"
