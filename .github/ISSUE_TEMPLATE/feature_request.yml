name: Feature request
description: Suggest a new check, assertion, option or command.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to test or do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could look, for example a YAML snippet or a command.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Workarounds or other tools you've tried.
