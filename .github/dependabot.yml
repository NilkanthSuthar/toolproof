version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    # toolproof is a library: keep the minimum versions users need as they are,
    # and only open a PR when a new release falls outside an allowed range
    # (for example mcp 3 or ruff 0.17).
    versioning-strategy: increase-if-necessary
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
