[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolproof"
version = "0.1.0"
description = "Automated tests for MCP servers: schema checks, YAML test cases, JUnit output and a pytest plugin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nilkanth Suthar" }]
requires-python = ">=3.11"
keywords = ["mcp", "model-context-protocol", "testing", "pytest", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=2.3,<3",
    "typer>=0.12",
    "pydantic>=2.7",
    "jsonschema>=4.21",
    "jsonpath-ng>=1.6",
    "rich>=13",
    "pyyaml>=6",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML", "types-jsonschema"]

[project.urls]
Homepage = "https://github.com/NilkanthSuthar/toolproof"
Issues = "https://github.com/NilkanthSuthar/toolproof/issues"

[project.scripts]
toolproof = "toolproof.cli:app"

[project.entry-points.pytest11]
toolproof = "toolproof.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/toolproof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/toolproof"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng", "jsonpath_ng.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
