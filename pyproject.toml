[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-toolproof"
version = "0.2.0"
description = "Automated tests for MCP servers: schema checks, YAML test cases, fuzzing, benchmarks, JUnit output and a pytest plugin."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nilkanth Suthar" }]
maintainers = [{ name = "Nilkanth Suthar" }]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "testing",
    "pytest",
    "fuzzing",
    "benchmark",
    "hypothesis",
    "junit",
    "ci",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: Hypothesis",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.3,<3",
    "typer>=0.27.2",
    "pydantic>=2.13.5",
    "jsonschema>=4.26.0",
    "jsonpath-ng>=1.8.0",
    "rich>=15.0.0",
    "pyyaml>=6.0.3",
    "anyio>=4.15.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.3",
    "hypothesis-jsonschema>=0.23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "coverage[toml]>=7.16.2",
    "ruff>=0.16.10,<0.17",
    "mypy>=2.4.0",
    "types-PyYAML",
    "types-jsonschema",
    "build>=1.6.1",
    "twine>=7.0.0",
    "pre-commit>=4.6.2",
]
docs = ["mkdocs>=1.6.1,<2", "mkdocs-material>=9.7.7"]

[project.urls]
Homepage = "https://github.com/NilkanthSuthar/toolproof"
Documentation = "https://nilkanthsuthar.github.io/toolproof/"
Source = "https://github.com/NilkanthSuthar/toolproof"
Changelog = "https://github.com/NilkanthSuthar/toolproof/blob/main/CHANGELOG.md"
Issues = "https://github.com/NilkanthSuthar/toolproof/issues"

[project.scripts]
toolproof = "toolproof.cli:app"

[project.entry-points.pytest11]
toolproof = "toolproof.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/toolproof"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/toolproof"]

[[tool.mypy.overrides]]
module = ["jsonpath_ng", "jsonpath_ng.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["toolproof"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
