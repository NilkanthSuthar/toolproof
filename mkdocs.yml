site_name: toolproof
site_description: Automated tests for MCP servers - schema checks, YAML tests, fuzzing, benchmarks and a pytest plugin.
site_url: https://nilkanthsuthar.github.io/toolproof/
repo_url: https://github.com/NilkanthSuthar/toolproof
repo_name: NilkanthSuthar/toolproof
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Nilkanth Suthar

theme:
  name: material
  features:
    - content.code.copy
    - content.action.edit
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      # Resolve includes like CHANGELOG.md from this file's folder, not the current directory.
      base_path: !relative $config_dir
      check_paths: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Configuration: guide/configuration.md
      - Assertions: guide/assertions.md
      - Static checks: guide/static-checks.md
      - Fuzzing: guide/fuzzing.md
      - Benchmarks: guide/benchmarks.md
      - pytest plugin: guide/pytest-plugin.md
      - Running in CI: guide/ci.md
  - Recipes:
      - Testing a FastMCP server: recipes/fastmcp.md
      - Servers in other languages: recipes/other-languages.md
      - Testing over HTTP: recipes/http.md
      - Security boundaries: recipes/security-boundaries.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
      - Reports: reference/reports.md
  - Troubleshooting: troubleshooting.md
  - About:
      - Comparison with other tools: about/comparison.md
      - Versioning and support: about/versioning.md
      - Changelog: about/changelog.md
      - Contributing: about/contributing.md
